# This action.yml provides a GitHub Action for testing modified code
# repositories through their corresponding Spack recipe (or a custom
# copy thereof). It does so by downloading Spack, building the modified
# code through Spack, and running unit tests ("spack install --test").
#
# Alex Richert, April 2024
name: 'Spack package tester'
description: 'Install and test code through Spack'

inputs:
  package-name:
    description: 'Spack package name to be tested (no version number or variants)'
    required: true
  package-version:
    description: 'Version of Spack package to be tested'
    required: false
    default: 'develop'
  package-variants:
    description: 'Variants to apply to package spec'
    required: false
  custom-recipe:
    description: 'Path to custom recipe for package to be tested, relative to repo root'
    required: false
    default: 'none'
  dependents-to-test:
    description: 'Spack packages to also run unit tests for (space-delimited list with variants)'
    required: false
  use-common-build-cache:
    description: 'Use common GitHub Packages binary mirror'
    default: true
    type: boolean
  upload-artifacts:
    description: 'Upload certain logs on job failure (options: always, never, on-failure)'
    required: false
    default: 'on-failure'
  repo-dir:
    description: 'Directory containing modified code to be tested (default is to download automatically)'
    required: false
    default: 'auto'
  spack-ref:
    description: 'Spack tag/branch/commit to use'
    required: false
    default: 'develop'
  cpu-target:
    description: 'Spack CPU target'
    required: false
    default: 'x86_64'
  spack-externals:
    description: 'External packages for Spack to try to use'
    required: false
    default: ''
  spack-compiler:
    description: 'Set spec for Spack compiler (e.g., "gcc@12")'
    required: false
    default: gcc
  parallel-jobs:
    description: 'Set number of Spack parallel install jobs ("spack install -j/--jobs")'
    required: false
    default: 2
  spack-root:
    description: 'Spack root directory'
    required: false
    default: 'spack-root'
  container-spack-env-path:
    description: 'Path to container Spack environment'
    required: false
    default: '/opt/spack/environment'
  cache-secret:
    description: 'Secret for build cache'
    required: false
  unique-id:
    description: 'Unique ID for artifact name'
    required: false
  use-repo-cache:
    description: 'Enable repo-level caching'
    default: true
    type: boolean
  repo-cache-key-suffix:
    description: 'String to append to repo-level cache key'
    default: 1
  repo-save-key-suffix:
    description: 'Save a repo-level cache entry different from the restored one'
    default: ''
  cache-spack-lock:
    description: 'Cache spack.lock to speed up concretization'
    default: true
    type: boolean
  test-package-load:
    description: 'Run "spack load <package-name>" to verify setup_run_environment() does not fail'
    default: true
    type: boolean
  spack-test-flag:
    description: 'Flag to use for enabling install-time testing (argument to `spack install`)'
    default: '--test root'
  save-repo-cache:
    description: 'Save repo cache (use-repo-cache must be true)'
    default: true
    type: boolean
  dependencies-only:
    description: "Only install the requested spec's dependencies"
    default: false
    type: boolean
  package-only:
    description: "Only install the requested spec (no deps; only useful for CI testing)"
    default: false
    type: boolean
  no-cached-roots:
    description: "Don't install from build-cached packages for root specs"
    default: true
    type: boolean
  use-dependency-reuse-marker-cache:
    description: 'Enable dependency reusability marker cache'
    default: true
    type: boolean

runs:
  using: "composite"
  steps:

    - name: "Get the updated code if needed"
      uses: actions/checkout@v4
      if: inputs.repo-dir == 'auto'
      with: 
        path: spack-devpkg-${{ inputs.package-name }}
        submodules: recursive

    - name: "Point to existing code if needed"
      if: inputs.repo-dir != 'auto'
      shell: bash
      run: |
        ln -s ${{ inputs.repo-dir }} spack-devpkg-${{ inputs.package-name }}

    - name: "Detect preexisting container Spack"
      shell: bash
      run: |
        use_preexisting_container_spack=false
        action_spack_root_path="${GITHUB_WORKSPACE}/${{ inputs.spack-root }}"

        if [[ "${GITHUB_ACTIONS}" == "true" && ( -f /.dockerenv || -n "${RUNNER_CONTAINER_HOOKS}" ) ]]; then
          if command -v spack >/dev/null 2>&1; then
            detected_spack_root="$(spack location -r)"
            wrapper_dir="${GITHUB_WORKSPACE}/.spack-shell"
            mkdir -p "${wrapper_dir}"
            {
              printf '%s\n' '#!/usr/bin/env bash'
              printf '. %q\n' "${detected_spack_root}/share/spack/setup-env.sh"
              printf '%s\n' 'exec bash "$@"'
            } > "${wrapper_dir}/spack-bash"
            chmod +x "${wrapper_dir}/spack-bash"
            echo "${wrapper_dir}" >> "$GITHUB_PATH"

            use_preexisting_container_spack=true
            action_spack_root_path="${detected_spack_root}"
            echo "SPACK_ROOT=${detected_spack_root}" >> "$GITHUB_ENV"
          fi
        fi

        echo "USE_PREEXISTING_CONTAINER_SPACK=${use_preexisting_container_spack}" >> "$GITHUB_ENV"
        echo "ACTION_SPACK_ROOT_PATH=${action_spack_root_path}" >> "$GITHUB_ENV"

    - name: "Get Spack"
      if: env.USE_PREEXISTING_CONTAINER_SPACK != 'true'
      uses: spack/setup-spack@v2.1.1
      with:
        ref: ${{ inputs.spack-ref }}
        path: ${{ inputs.spack-root }}
        color: false

    - name: "Get spack-helpers"
      uses: NOAA-EMC/spack-helpers@develop

    - name: "Update recipe (if needed)"
      if: inputs.custom-recipe != 'none'
      shell: spack-bash {0}
      run: |
        cp spack-devpkg-${{ inputs.package-name }}/${{ inputs.custom-recipe }} $(spack location --package-dir ${{ inputs.package-name }})/package.py

    - name: "Restore repo-level cache"
      uses: actions/cache/restore@v4
      id: restore-repo-cache
      if: inputs.use-repo-cache == 'true'
      with:
        path: ${{ github.workspace }}/spack-build-cache
        key: repo-cache-${{ inputs.repo-cache-key-suffix }}

    - name: "Cache spack.lock"
      uses: actions/cache@v4
      if: inputs.cache-spack-lock == 'true'
      with:
        path: ${{ env.ACTION_SPACK_ROOT_PATH }}/spack.lock
        key: spack-lock-cache-${{ inputs.repo-cache-key-suffix }}

    - name: "Cache dependency reusability markers"
      uses: actions/cache@v4
      if: inputs.use-dependency-reuse-marker-cache == 'true'
      with:
        path: ${{ github.workspace }}/dependency-reuse-marker-cache
        key: dependency-reuse-marker-cache-${{ inputs.repo-cache-key-suffix }}

    - name: "Do Spack installation and tests"
      shell: spack-bash {0}
      run: |
        ## Define spack wrapper function
        spack_exe() {
          if [ "$RUNNER_DEBUG" == "1" ]; then
            spack --debug "$@" 2>&1 | perl -pe 's|^([^=]*==>.+?\[\d{4}-\d{1,2}-\d{1,2}-\d\d:\d\d:\d\d\.\d{6}\])|::debug::\1|'
          else
            spack "$@"
          fi
        }

        ## Setup build caches and mirrors
        if [ "${{ inputs.use-repo-cache }}" == true ]; then
          spack_exe mirror add repo-build-cache $GITHUB_WORKSPACE/spack-build-cache
        fi
        if [ "${{ inputs.use-common-build-cache }}" == true ]; then
          spack_exe mirror add emc-common-build-cache oci://ghcr.io/NOAA-EMC/ci-common-build-cache
          export OCIUSER=NOAA-EMC
          export OCIPASSWORD="${{ github.token }}"
          spack_exe mirror set --oci-username OCIUSER --oci-password-variable OCIPASSWORD emc-common-build-cache
        fi
        spack_exe mirror remove github-actions-buildcache
        spack_exe mirror list
        spack_exe buildcache list --allarch |& sed 's|^|::debug::|'

        ## Detect containerized GitHub Actions execution context
        running_in_containerized_github_actions=false
        if [[ "${GITHUB_ACTIONS}" == "true" && ( -f /.dockerenv || -f /run/.containerenv || -n "${RUNNER_CONTAINER_HOOKS}" ) ]]; then
          running_in_containerized_github_actions=true
        fi

        ## Paths for a preexisting Spack environment in the container image
        container_spack_env_path="${{ inputs.container-spack-env-path }}"

        ## Prefer reusing already-installed packages when possible
        spack_exe config add "concretizer:reuse:true"

        ## Create and configure test environment
        spack_exe env create --without-view test
        spack env activate test
        # Point to the modified code
        spack_exe develop --no-clone --path ${GITHUB_WORKSPACE}/spack-devpkg-${{ inputs.package-name }} ${{ inputs.package-name }}@${{ inputs.package-version }}
        spack_exe add ${{ inputs.package-name }}@${{ inputs.package-version }} ${{ inputs.package-variants }} ${{ inputs.dependents-to-test }}

        ## Configure compiler and target settings
        spack_exe compiler find
        spack_exe config add 'packages:all:require:"target=${{ inputs.cpu-target }}"'
        spack_exe config add 'packages:all:prefer:["%${{ inputs.spack-compiler }}"]'
        spack_exe config add "concretizer:reuse:include:['%${{ inputs.spack-compiler }}']"

        ## Configure external packages if specified
        if [[ ! -z "${{ inputs.spack-externals }}" && "${{ inputs.use-common-build-cache }}" != true ]]; then
          for package in ${{ inputs.spack-externals }}; do
            spack_exe config add "packages:$package:buildable:false"
          done
          if [[ (" ${{ inputs.spack-externals }} " =~ " openblas ") && ( ${{ runner.os }} == Linux ) ]]; then
            spack_exe external find --path /usr/lib/x86_64-linux-gnu/openblas-serial openblas
            spack_exe config add "packages:lapack:buildable:false"
            spack_exe config add "packages:blas:buildable:false"
          fi
          spack_exe external find $(echo ${{ inputs.spack-externals }} | sed "s:\bopenblas\b::g")
        fi

        ## Filter out unwanted compilers
        if [[ "${{ inputs.spack-compiler }}" =~ intel-oneapi ]]; then
          alsogcc=gcc
        fi
        spack_exe filter-compilers ${{ inputs.spack-compiler }} $alsogcc --keep-only

        ## Restore cached lock file if available
        if [[ "${{ inputs.cache-spack-lock }}" == true && -f $SPACK_ROOT/spack.lock ]]; then
          cp "$ACTION_SPACK_ROOT_PATH/spack.lock" "$SPACK_ENV/."
        fi

        ## In containerized CI, prefer a preexisting container environment lock if provided.
        using_container_spack_lock=false
        if [[ "${running_in_containerized_github_actions}" == true \
              && "${container_spack_env_path}" != "__SET_ME_CONTAINER_SPACK_ENV_PATH__" \
              && -f "${container_spack_env_path}/spack.lock" ]]; then
          cp "${container_spack_env_path}/spack.lock" "$SPACK_ENV/spack.lock"
          using_container_spack_lock=true
          echo "Using spack.lock from preexisting container environment: ${container_spack_env_path}"
        fi

        # Print spack.yaml
        echo -e "spack.yaml:\n========="
        cat ${SPACK_ENV}/spack.yaml
        echo "========="

        ## Prepare install flags
        if [ "$RUNNER_DEBUG" == "1" ]; then verboseflag="--verbose"; fi
        if [ "${{ inputs.dependencies-only }}" == "true" ]; then onlyflag="--only dependencies"; fi
        if [ "${{ inputs.package-only }}" == "true" ]; then onlyflag="--use-buildcache dependencies:only"; fi
        if [ "${{ inputs.no-cached-roots }}" == "true" ]; then cacheflag="--use-buildcache package:never"; fi

        ## In a containerized GitHub Actions context, strictly verify that requested
        ## specs can be reused before skipping explicit concretization.
        skip_concretize_and_full_install=false
        if [[ "${running_in_containerized_github_actions}" == true && "${using_container_spack_lock}" == true ]]; then
          reusability_check_script="${GITHUB_ACTION_PATH}/check_dependency_reusability.py"
          dependency_reuse_marker_dir="${GITHUB_WORKSPACE}/dependency-reuse-marker-cache"
          mkdir -p "${dependency_reuse_marker_dir}"

          reusability_lock_hash=$(sha256sum "${container_spack_env_path}/spack.lock" | awk '{print $1}')
          reusability_script_hash=$(sha256sum "${reusability_check_script}" | awk '{print $1}')
          reusability_constraints_hash=$(printf '%s\n' \
            "package-name=${{ inputs.package-name }}" \
            "package-version=${{ inputs.package-version }}" \
            "package-variants=${{ inputs.package-variants }}" \
            "dependents-to-test=${{ inputs.dependents-to-test }}" \
            "container-env-path=${container_spack_env_path}" \
            "spack-lock-sha256=${reusability_lock_hash}" \
            "script-sha256=${reusability_script_hash}" \
            | sha256sum | awk '{print $1}')
          dependency_reuse_marker_file="${dependency_reuse_marker_dir}/${reusability_constraints_hash}.ok"

          if [[ "${{ inputs.use-dependency-reuse-marker-cache }}" == "true" && -f "${dependency_reuse_marker_file}" ]]; then
            reusability_check_rc=0
            echo "Dependency reusability marker hit (${reusability_constraints_hash}); skipping script execution."
          else
            set +e
            spack-python "${reusability_check_script}" \
              --env-path "${container_spack_env_path}" \
              --package-name "${{ inputs.package-name }}" \
              --package-version "${{ inputs.package-version }}" \
              --package-variants "${{ inputs.package-variants }}" \
              --dependents-to-test "${{ inputs.dependents-to-test }}"
            reusability_check_rc=$?
            set -e
            if [[ "${{ inputs.use-dependency-reuse-marker-cache }}" == "true" && ${reusability_check_rc} -eq 0 ]]; then
              {
                printf 'constraint-hash=%s\n' "${reusability_constraints_hash}"
                printf 'container-env-path=%s\n' "${container_spack_env_path}"
                printf 'spack-lock-sha256=%s\n' "${reusability_lock_hash}"
                printf 'script-sha256=%s\n' "${reusability_script_hash}"
                printf 'created-at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              } > "${dependency_reuse_marker_file}"
            fi
          fi

          if [[ ${reusability_check_rc} -eq 0 ]]; then
            skip_concretize_and_full_install=true
            echo "Reusability script returned success; skipping explicit concretize/full-install pass."
          else
            echo "Reusability script reported dependencies are not reusable; running full concretize/install flow."
          fi

          if [[ "${skip_concretize_and_full_install}" == true && -z "${onlyflag}" ]]; then
            # Install only root specs (package under test + any requested dependents).
            onlyflag="--only package"
          fi

          if [[ "${skip_concretize_and_full_install}" == true ]]; then
            echo "Detected containerized GitHub Actions context with matching preexisting container environment."
            echo "Container Spack env path: ${container_spack_env_path}"
            echo "Container Spack view path: ${container_spack_view_path}"

            set +e
            spack_exe install --jobs ${{ inputs.parallel-jobs }} ${{ inputs.spack-test-flag }} --no-check-signature $verboseflag $onlyflag $cacheflag
            rc=$?
            set -e

            if [[ ${rc} -eq 0 ]]; then
              echo "Root-only install succeeded."
            else
              skip_concretize_and_full_install=false
              echo "Root-only install failed; running full concretize/install flow."
            fi
          fi
        elif [[ "${running_in_containerized_github_actions}" == true ]]; then
          echo "Containerized run detected, but no preexisting container environment lock was provided; running full concretize/install flow."
        fi

        ## Concretize the environment
        if [[ "${skip_concretize_and_full_install}" != true ]]; then
          spack_exe concretize 2> ${GITHUB_WORKSPACE}/spack-concretize-err.log 1> ${GITHUB_WORKSPACE}/spack-concretize-out.log
          cat ${GITHUB_WORKSPACE}/spack-concretize-out.log
        fi

        ## Validate configuration
        spack_exe validate compilers ${{ inputs.spack-compiler }}
        if [[ "${{ inputs.cache-spack-lock }}" == true && -f $SPACK_ENV/spack.lock ]]; then
          cp "$SPACK_ENV/spack.lock" "$ACTION_SPACK_ROOT_PATH/."
        fi

        ## Install, including running install-time tests ('make test' etc.)
        if [[ "${skip_concretize_and_full_install}" != true ]]; then
          set +e
          spack_exe install --jobs ${{ inputs.parallel-jobs }} ${{ inputs.spack-test-flag }} --no-check-signature $verboseflag $onlyflag $cacheflag
          rc=$?
          set -e
        fi

        ## Cache built packages and verify the package loads
        if [[ "${{ inputs.use-repo-cache }}" == true  && "${{ inputs.package-only }}" == "false" ]]; then
          spack_exe buildcache push --unsigned $GITHUB_WORKSPACE/spack-build-cache $(spack find --format "{name}/{hash:7}")
        fi
        if [[ ${{ inputs.test-package-load }} == true && "${{ inputs.dependencies-only }}" == "false" ]]; then
          spack_exe load ${{ inputs.package-name }}
        fi
        exit $rc

    - name: "Save repo-level cache"
      uses: actions/cache/save@v4
      if: always() && inputs.use-repo-cache == 'true' && ( steps.restore-repo-cache.outputs.cache-hit != 'true' || inputs.repo-save-key-suffix != '' ) && inputs.save-repo-cache == 'true'
      with:
        path: ${{ github.workspace }}/spack-build-cache
        key: repo-cache-${{ inputs.repo-cache-key-suffix }}${{ inputs.repo-save-key-suffix }}

    - name: "Generate unique ID"
      if: ( failure() && inputs.upload-artifacts == 'on-failure' ) || inputs.upload-artifacts == 'always'
      shell: bash
      run: |
        if [ -z ${{ inputs.unique-id }} ]; then
          uniqid="${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.package-name }}-${{ inputs.package-version }}-${{ inputs.package-variants }}"
          uniqid="$uniqid$(date +%s.%N)"
          uniqid="${{ github.sha }}-$(echo $uniqid | md5sum | awk '{print $1}')"
        else
          uniqid=${{ inputs.unique-id }}
        fi
        echo "uniqid=$uniqid" >> $GITHUB_ENV

    - name: "Upload various debug info"
      uses: actions/upload-artifact@v4
      if: ( failure() && inputs.upload-artifacts == 'on-failure' ) || inputs.upload-artifacts == 'always'
      with:
        name: spack-package-test-artifacts-${{ env.uniqid }}
        path: |
          ${{ env.ACTION_SPACK_ROOT_PATH }}/var/spack/environments/test/spack.yaml
          ${{ github.workspace }}/spack-concretize-out.log
          ${{ github.workspace }}/spack-concretize-err.log
          ${{ env.ACTION_SPACK_ROOT_PATH }}/var/spack/environments/test/${{ inputs.package-name }}/spack-build-*/Testing/Temporary/LastTest.log
          /tmp/runner/spack-stage/spack-stage-*/spack-build-out.txt
          /tmp/runner/spack-stage/spack-stage-*/install-time-test-log.txt
          /tmp/runner/spack-stage/spack-stage-*/spack-build-*/Testing/Temporary/LastTest.log
          /tmp/runner/spack-stage/spack-stage-*/spack-build-*/FV3/ccpp/ccpp_prebuild.*
